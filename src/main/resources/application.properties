server.port=8082
spring.application.name=pet-service
spring.threads.virtual.enabled=true
# DataSource Settings
spring.datasource.url=jdbc:postgresql://localhost:5433/${POSTGRES_PET_DB}
spring.datasource.username=${POSTGRES_PET_USER}
spring.datasource.password=${POSTGRES_PET_PASSWORD}
# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Multipart File Upload Limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Custom S3 Properties
aws.s3.bucket-name=pawstay-pets
aws.s3.endpoint=http://localhost:9000
aws.s3.access-key-id=minioadmin
aws.s3.secret-access-key=minioadmin

