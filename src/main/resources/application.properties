server.port=8082
spring.application.name=pet-service
spring.threads.virtual.enabled=true
# DataSource Settings
spring.datasource.url=jdbc:postgresql://localhost:5433/${POSTGRES_PET_DB}
spring.datasource.username=${POSTGRES_PET_USER}
spring.datasource.password=${POSTGRES_PET_PASSWORD}
# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Multipart File Upload Limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Custom S3 Properties
aws.s3.bucket-name=${AWS_S3_BUCKET_NAM}
aws.s3.endpoint=${AWS_S3_ENDPOINT}
aws.s3.access-key-id=${AWS_S3_ACCESS_KEY_ID}
aws.s3.secret-access-key=${AWS_S3_SECRET_ACCESS_KEY}

